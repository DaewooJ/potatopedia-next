<!doctype html><html><head><meta charset="utf-8"><title>Potatopedia YouTube banner</title>
<style>
@font-face{font-family:P;src:local("Poppins Bold"),local("Poppins-Bold");font-weight:700}
@font-face{font-family:P;src:local("Poppins Medium"),local("Poppins-Medium");font-weight:500}
*{margin:0;padding:0;box-sizing:border-box}
body{width:2048px;height:1152px;overflow:hidden;font-family:P,Poppins,sans-serif;background:#FBF7F4}
.b{position:relative;width:2048px;height:1152px;background:linear-gradient(100deg,#FFFDFB 0%,#FBF4F0 60%,#F8ECE8 100%);color:#1E1E1E;overflow:hidden}
.ring{position:absolute;border:4px solid rgba(198,40,40,.10);border-radius:50%}
.r1{width:900px;height:900px;right:-300px;top:-420px}
.r2{width:560px;height:560px;right:260px;top:-330px}
.r3{width:760px;height:760px;left:-300px;bottom:-420px}
.r4{width:420px;height:420px;left:120px;top:-260px}
.bar{position:absolute;left:0;top:0;width:2048px;height:14px;background:#C62828}
.bar2{position:absolute;left:0;bottom:0;width:2048px;height:14px;background:#C62828}
/* every word sits inside the 1235x338 all-devices area (itself inside the 1546x423 safe area), centred */
.safe{position:absolute;left:406px;top:407px;width:1235px;height:338px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.h{font-weight:700;font-size:62px;line-height:1.05;letter-spacing:-1px;color:#B71C1C}
.s{margin-top:18px;font-weight:500;font-size:27px;line-height:1.35;color:#3C3C3C;max-width:1100px}
.u{margin-top:18px;font-weight:700;font-size:27px;color:#C62828;letter-spacing:.5px}
.rule{width:100px;height:5px;background:#E2C08D;border-radius:3px;margin-top:20px}
</style></head><body><div class="b">
<div class="bar"></div><div class="bar2"></div>
<div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div>
<div class="safe">
 <div class="h">The world's potato knowledge base</div>
 <div class="s">Sourced data stories on production, consumption, trade, varieties, seed and processing · 204 countries</div>
 <div class="rule"></div>
 <div class="u">potatopedia.com</div>
</div>
</div></body></html>
